<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Form - Student Registration</title>
</head>
<body>

    <main>
        <h1>Student Registration Form</h1>

        <form method="post">

            <p>
                <label for="full-name">Full Name:</label><br>
                <input id="full-name" name="full-name" type="text" placeholder="Enter your name">
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input id="email" name="email" type="email" placeholder="Enter your email">
            </p>

            <p>
                <label for="password">Password:</label><br>
                <input id="password" name="password" type="password" placeholder="Enter password">
            </p>

            <fieldset>
                <legend>Gender</legend>
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>
                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </fieldset>

            <p>
                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="">Select Course</option>
                    <option value="b-tech">B.Tech</option>
                    <option value="bca">BCA</option>
                    <option value="b-sc">B.Sc</option>
                    <option value="b-com">B.Com</option>
                </select>
            </p>

            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="30" placeholder="Write something..."></textarea>
            </p>

            <button type="submit">Register</button>

        </form>
    </main>

</body>
</html>
